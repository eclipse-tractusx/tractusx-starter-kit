name: Bug report
description: Report a reproducible problem with the Starter Kit.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow our [security policy](https://github.com/eclipse-tractusx/tractusx-starter-kit/blob/main/SECURITY.md) instead of opening a public issue.
        Do not include secrets or private configuration.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal example and sanitized logs where useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the version or commit, operating system, and browser or Docker version as applicable.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Copyright (c) 2026 Contributors to the Eclipse Foundation · [CC-BY-4.0](https://creativecommons.org/licenses/by/4.0/legalcode)
        · [Template source](https://github.com/eclipse-tractusx/tractusx-starter-kit/blob/main/.github/ISSUE_TEMPLATE/bug_report.yml)
