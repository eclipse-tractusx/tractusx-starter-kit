name: Feature request
description: Suggest an improvement to the Starter Kit.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who would benefit and what problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any alternatives considered.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
