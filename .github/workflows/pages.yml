name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'eclipse-tractusx/tractusx-starter-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build static documentation
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R docs/. "$RUNNER_TEMP/site/"
          sed -i \
            -e "s|/blob/main/|/blob/$GITHUB_SHA/|g" \
            -e "s|/tree/main|/tree/$GITHUB_SHA|g" \
            -e "s|Source revision: main|Source revision: $GITHUB_SHA|g" \
            "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/styles.css"
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ runner.temp }}/site
          enable_jekyll: false
      # GITHUB_TOKEN pushes do not automatically trigger legacy Pages builds.
      - name: Request and verify legacy Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SITE_URL: https://eclipse-tractusx.github.io/tractusx-starter-kit/
        run: |
          published_sha=$(gh api "repos/$GH_REPO/git/ref/heads/gh-pages" --jq '.object.sha')
          gh api --method POST "repos/$GH_REPO/pages/builds"
          for attempt in {1..30}; do
            build=$(gh api "repos/$GH_REPO/pages/builds/latest")
            if [ "$(jq -r '.commit' <<< "$build")" = "$published_sha" ]; then
              status=$(jq -r '.status' <<< "$build")
              if [ "$status" = "errored" ]; then
                jq -r '.error.message' <<< "$build"
                exit 1
              fi
              if [ "$status" = "built" ] &&
                curl --fail --silent --show-error --max-time 20 "$SITE_URL" -o "$RUNNER_TEMP/published.html" &&
                grep -Fq "Source revision: $GITHUB_SHA" "$RUNNER_TEMP/published.html"; then
                echo "Verified deployment of $GITHUB_SHA at $SITE_URL"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the published Pages revision."
          exit 1
