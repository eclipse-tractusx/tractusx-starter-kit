# The smallest useful dataspace: two connectors that can negotiate with each
# other, no Digital Twin Registry, no stand-ins, a pinned TestLab. Only the keys
# that differ from toolbox.yaml are here.

participants:
  - name: provider
    bpn: BPNL000000000001
  - name: consumer
    bpn: BPNL000000000002

stand-ins:
  echo: false
  stub-caller: false
  submodel-server: false

testlab:
  version: "1.0.0a24"
