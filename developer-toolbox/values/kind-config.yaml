# The kind cluster the developer toolbox runs in, on a GitHub runner and on a
# developer's machine. One node; the ingress controller listens on its ports
# 80 and 443, which are published on the host's loopback only, so a dataspace
# with demo API keys is never reachable from the network the host is on.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
