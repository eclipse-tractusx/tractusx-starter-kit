## This code was partially generated using artificial intelligence (AI) (Tool: Codex, Model: GPT-5.6 Sol; Tool: Claude Code, Model: Claude Opus 5.5).
## It was reviewed and tested by a human committer.

# One dataspace participant: a connector and its wallet (IdentityHub). It is
# the values of one `decentralized-identity-connector` alias of the Umbrella
# chart, and scripts/render_toolbox.py writes one copy per participant in the
# toolbox configuration, with its fields (the `$`-placeholders) filled in.
#
# It is Umbrella's `edc-provider` block of values-adopter-decentralized-
# identityhub.yaml with the toolbox's CI changes merged in, spelled out in
# full: a participant Umbrella does not declare gets nothing from that profile,
# so everything it needs is here.
#
# Two things this file is responsible for:
#
#   1. Isolating each connector's DSP / management APIs onto their own ingress
#      hostnames, so nothing else on `${host}` can shadow them.
#   2. Making the release survive on a 4-vCPU GitHub runner: every JVM in the
#      release boots at the same time on a heavily contended CPU, so the stock
#      30s/100s liveness delays kill pods before they finish starting. The delay
#      alone is not enough. A probe that starts late still gives up after
#      `failureThreshold` misses — 30s at the stock six — and a JVM that is only
#      slow is then restarted, which puts its boot back at the end of the queue
#      on a node that is now busier than when it started. That loop never
#      converges, and what `helm install --wait` reports 15 minutes later is a
#      pod that never became ready. Every liveness probe here therefore also
#      gets a threshold worth minutes rather than seconds: liveness is here to
#      catch a runtime that has *hung*, and on this node nothing can tell "hung"
#      from "slow" in half a minute.
#
# Note what this file deliberately does NOT touch: the profile's vault wiring.
# `install.vault` stays `false` and the connector bundle's own vault stays
# enabled, because the bundle is what ships `post-install-vault-setup` — the
# hook that writes tokenSignerPrivateKey / tokenSignerPublicKey /
# tokenEncryptionAesKey into the participant's vault. Deploying the vault from
# `install.vault` instead gives you a vault with no secrets in it, and every
# data-plane transfer then fails to sign its EDR. The manifest validation
# (scripts/validate_manifest.py) asserts the hook of every participant.

enabled: true
nameOverride: ${name}
install:
  # No Postgres for this participant. The IdentityHub is in-memory (see
  # below) and the connector never used it — the `edc` database it still
  # renders a JDBC URL for goes unopened, because the in-memory runtime has no
  # SQL extensions to dial it with. A Digital Twin Registry keeps its own
  # database, inside the digital-twin bundle.
  postgresql: false
  vault: false
postgresql:
  nameOverride: ${name}-postgresql
  connector:
    jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-${name}-postgresql:5432/edc"
  identityhub:
    jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-${name}-postgresql:5432/ih"
vault:
  nameOverride: ${name}-vault
  hashicorp:
    url: "http://{{ .Release.Name }}-${name}-vault:8200"

tx-data-provider:
  enabled: true
  nameOverride: ${name}-edc
  controlplanePublicUrl: "http://${dsp_host}"
  controlplaneManagementUrl: "http://${management_host}"
  # Nothing in the suite pulls from a `simple-data-backend`: transfers resolve
  # to the toolbox's own `tck-echo` pod, and submodels are served by the
  # toolbox's submodel server.
  data-persistence-layer-bundle:
    enabled: false
  # Switched on per participant by `dtr: true` (values/participant-dtr.values.yaml).
  digital-twin-bundle:
    enabled: false
  dataspace-connector-bundle:
    enabled: true
    nameOverride: ${name}-dsc
    secrets:
      edc-wallet-secret: "${secret_value}"
    vault:
      enabled: true
      nameOverride: ${name}-vault
      # The agent injector is not used here and costs a Deployment plus two
      # cluster-scoped MutatingWebhookConfigurations per participant.
      injector:
        enabled: false
    tractusx-connector:
      enabled: true
      nameOverride: ${name}-connector
      postgresql:
        jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-${name}-postgresql:5432/edc"
      vault:
        hashicorp:
          url: "http://{{ .Release.Name }}-${name}-vault:8200"
      participant:
        id: "${bpn}"
        # Participant Context Id - Required since tractusx-edc 0.12.0 (multi-tenancy)
        contextId: "${context_id}"
      iatp:
        id: "${did}"
        trustedIssuers:
          - "${issuer_did}"
        sts:
          dim:
            url: ""
          oauth:
            token_url: "http://${host}/identityhub/api/sts/token"
            client:
              id: "${did}"
              secret_alias: "${secret_alias}"
      controlplane:
        # The connector runs the single in-memory runtime instead of the
        # Postgres + HashiCorp-Vault control plane. `edc-runtime-memory`
        # bundles the control plane *and* the data plane, so this pod also
        # boots the data-plane half and wants the settings that half reads; the
        # block below is the set the upstream `tractusx-connector-memory` chart
        # renders and this one does not.
        #
        # That embedded data plane is not idle: it self-registers with the
        # control plane it shares a JVM with, and it is the *only* instance that
        # ever reaches the control plane's selector — the data-plane pod below
        # registers into its own in-memory store, because the runtime it runs
        # bundles a selector of its own. So every transfer is started here, and
        # the EDR token is minted into this pod's in-memory `AccessTokenData`
        # store. The public base URL therefore has to address *this* pod:
        # pointed at the data-plane pod, the consumer takes a valid token to a
        # runtime that has never seen it and the pull fails with
        # `AccessTokenData with ID '…' does not exist`.
        image:
          repository: tractusx/edc-runtime-memory
        debug:
          enabled: false
          port: 5005
          suspendOnStart: false
        env:
          # The connector's *own* credential service, spelled with the raw DID.
          # Umbrella's profile writes this URL with the base64-encoded
          # participant id, which EDC IdentityHub 0.16 decoded and 0.17
          # (Tractus-X 0.4.0) looks up verbatim, answering 404. Negotiation
          # never notices: a counterparty finds this endpoint through the DID
          # document, which is right. The BDRS client does, because it fetches
          # this connector's own MembershipCredential from *this* setting to
          # read the BPN directory, and the provider's transfer provisioning
          # resolves the consumer's BPN through it — so every transfer sat in
          # REQUESTED until the run's 60s gave out (run 34627069005,
          # 2026-09-11) while the catalog and negotiation passed.
          TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL: "http://${host}/identityhub/api/credentials/v1/participants/${did}"
          EDC_IAM_DID_WEB_USE_HTTPS: false
          EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: application/json
          WEB_HTTP_PUBLIC_PORT: "8086"
          WEB_HTTP_PUBLIC_PATH: "/api/public"
          EDC_DATAPLANE_API_PUBLIC_BASEURL: "http://${host}/api/public"
          TX_EDC_DATAPLANE_TOKEN_REFRESH_ENDPOINT: "http://${host}/api/public/token"
          # Pin the DSP callback/audience. The chart otherwise derives them
          # from `controlplane.ingresses[0].hostname`, and a metrics-first order
          # would advertise `${host}/api/v1/dsp` — a path that host does not
          # serve — so the peer's agreement POST 404s at nginx.
          EDC_DSP_CALLBACK_ADDRESS: "http://${dsp_host}/api/v1/dsp"
          EDC_OAUTH_ENDPOINT_AUDIENCE: "http://${dsp_host}/api/v1/dsp"
          TX_EDC_DATAPLANE_TOKEN_EXPIRY: "300"
          TX_EDC_DATAPLANE_TOKEN_EXPIRY_TOLERANCE: "10"
          EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "tokenSignerPrivateKey"
          EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "tokenSignerPublicKey"
          TX_EDC_DPF_CONSUMER_PROXY_AUTH_APIKEY: "${api_key}"
        bdrs:
          cache_validity_seconds: 600
          server:
            url: "${bdrs_url}"
        policy:
          validation:
            enabled: true
        livenessProbe:
          initialDelaySeconds: 240
          failureThreshold: 60
        endpoints:
          default:
            path: /api
          management:
            path: /management
            authKey: "${api_key}"
          control:
            path: /control
          protocol:
            path: /api/v1/dsp
          catalog:
            path: /catalog
            authKey: "${api_key}"
          # `endpoints` only carries the names the chart's Service hard-codes,
          # and `public` is not one of them, so the public API this pod binds on
          # 8086 is exposed through the otherwise unused `metrics` slot: the
          # Deployment takes its container ports and the Ingress its paths
          # straight from this map, and the chart renders no `WEB_HTTP_METRICS_*`
          # settings, so nothing else reads it.
          metrics:
            port: 8086
            path: /api/public
        # DSP MUST stay first: tractusx-connector builds
        # `txdc.controlplane.url.protocol` from `ingresses[0]` unless
        # `controlplane.url.protocol` is set, and that URL becomes
        # EDC_DSP_CALLBACK_ADDRESS / EDC_OAUTH_ENDPOINT_AUDIENCE.
        ingresses:
          - enabled: true
            hostname: ${dsp_host}
            endpoints:
              - protocol
            className: nginx
            tls:
              enabled: false
          - enabled: true
            hostname: ${management_host}
            endpoints:
              - management
              - control
              - catalog
            className: nginx
            tls:
              enabled: false
          - enabled: true
            hostname: ${host}
            endpoints:
              - metrics
            className: nginx
            tls:
              enabled: false
      dataplane:
        # The same runtime in its data-plane role. The control-plane half it
        # also boots reads these; they are copied from the control-plane pod of
        # this participant, minus everything that would bind a port — this pod's
        # ports are the data plane's, and the management API it would otherwise
        # open on 8081 is where its public API already is.
        image:
          repository: tractusx/edc-runtime-memory
        env:
          # Same reason as on the control plane: this pod boots that half too.
          TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL: "http://${host}/identityhub/api/credentials/v1/participants/${did}"
          EDC_IAM_DID_WEB_USE_HTTPS: false
          EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: application/json
          TRACTUSX_EDC_PARTICIPANT_BPN: "${bpn}"
          EDC_DSP_CALLBACK_ADDRESS: "http://${dsp_host}/api/v1/dsp"
          EDC_OAUTH_PROVIDER_AUDIENCE: "idsc:IDS_CONNECTORS_ALL"
          EDC_OAUTH_ENDPOINT_AUDIENCE: "http://${dsp_host}/api/v1/dsp"
          EDC_IAM_TRUSTED-ISSUER_0-ISSUER_ID: "${issuer_did}"
          TX_EDC_IAM_IATP_BDRS_SERVER_URL: "${bdrs_url}"
          TX_EDC_IAM_IATP_BDRS_CACHE_VALIDITY: "600"
          TX_EDC_DCP_CACHE_ENABLED: "true"
          TX_EDC_DCP_CACHE_VALIDITY_SECONDS: "86400"
          EDC_POLICY_VALIDATION_ENABLED: "true"
          # Neither half of this pod should act as a connector in its own
          # right: no catalog crawling, and no DID registration racing the
          # control plane's.
          EDC_CATALOG_CACHE_EXECUTION_ENABLED: "false"
          TX_EDC_DID_SERVICE_SELF_REGISTRATION_ENABLED: "false"
          TX_EDC_DID_SERVICE_SELF_DEREGISTRATION_ENABLED: "false"
        endpoints:
          proxy:
            authKey: "${api_key}"
        token:
          signer:
            privatekey_alias: tokenSignerPrivateKey
          verifier:
            publickey_alias: tokenSignerPublicKey
          debug:
            enabled: false
            port: 1044
            suspendOnStart: false
        logs:
          level: DEBUG
        livenessProbe:
          initialDelaySeconds: 240
          failureThreshold: 60
        ingresses:
          - enabled: true
            hostname: ${host}
            tls:
              enabled: false
            endpoints:
              - public
          - enabled: true
            hostname: ${intranet_host}
            tls:
              enabled: false
            endpoints:
              - proxy

tractusx-identityhub:
  enabled: true
  nameOverride: ${name}-identityhub
  identityhub:
    # In-memory IdentityHub. The chart standing in this slot is
    # `tractusx-identityhub-memory`, renamed to the dependency's name by
    # scripts/prepare_chart.py, so this block still addresses it. Its image is
    # set from the toolbox configuration (`dataspace.identityhub.image`).
    iatp:
      sts:
        oauth:
          client:
            enabled: true
            id: "${did}"
            secret: "${secret_value}"
            secret_alias: "${secret_alias}"
            x_api_key: "${x_api_key}"
    didweb:
      https: false
    livenessProbe:
      initialDelaySeconds: 240
      failureThreshold: 60
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    ingresses:
      - enabled: true
        hostname: ${host}
        tls:
          enabled: false
        endpoints:
          - did
          - credentials
          - sts
      - enabled: true
        hostname: ${intranet_host}
        tls:
          enabled: false
        endpoints:
          - identity
