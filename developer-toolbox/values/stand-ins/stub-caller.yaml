# A stand-in system under test that calls back when told to, after a delay
# (scripts/stub_caller.py, mounted from the ConfigMap tck-stub). It has an
# ingress because the test engine, outside the cluster, tells it what to call.
#
# `namespace: umbrella` is rewritten to the release's namespace when it is applied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tck-stub
  namespace: umbrella
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: tck-stub
  namespace: umbrella
  labels: { app: tck-stub }
spec:
  serviceAccountName: tck-stub
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: stub
      image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
      imagePullPolicy: Always
      env: [{ name: PYTHONDONTWRITEBYTECODE, value: "1" }]
      command: ["python", "/stub/stub_caller.py", "--port", "8080"]
      ports: [{ containerPort: 8080 }]
      readinessProbe:
        httpGet: { path: /health, port: 8080 }
      livenessProbe:
        httpGet: { path: /health, port: 8080 }
        periodSeconds: 20
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 200m, memory: 128Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      volumeMounts: [{ name: stub, mountPath: /stub }]
  volumes:
    - name: stub
      configMap: { name: tck-stub }
---
apiVersion: v1
kind: Service
metadata:
  name: tck-stub
  namespace: umbrella
spec:
  selector: { app: tck-stub }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tck-stub
  namespace: umbrella
spec:
  rules:
    - host: tck-stub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: tck-stub, port: { number: 80 } }
