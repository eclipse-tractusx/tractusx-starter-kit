# The payload store behind the engine's registry entries (scripts/submodel_server.py,
# mounted from the ConfigMap tck-submodel). The engine uploads to it over the
# ingress, and a provider's data plane fetches from it on the same hostname,
# which CoreDNS resolves to the ingress.
#
# `namespace: umbrella` is rewritten to the release's namespace when it is applied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tck-submodel
  namespace: umbrella
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: tck-submodel
  namespace: umbrella
  labels: { app: tck-submodel }
spec:
  serviceAccountName: tck-submodel
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: submodel
      image: python:3.12-alpine
      env: [{ name: PYTHONDONTWRITEBYTECODE, value: "1" }]
      command: ["python", "/submodel/submodel_server.py", "--port", "8080"]
      ports: [{ containerPort: 8080 }]
      readinessProbe:
        httpGet: { path: /health, port: 8080 }
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 200m, memory: 128Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      volumeMounts: [{ name: submodel, mountPath: /submodel }]
  volumes:
    - name: submodel
      configMap: { name: tck-submodel }
---
apiVersion: v1
kind: Service
metadata:
  name: tck-submodel
  namespace: umbrella
spec:
  selector: { app: tck-submodel }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tck-submodel
  namespace: umbrella
spec:
  rules:
    - host: tck-submodel.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: tck-submodel, port: { number: 80 } }
