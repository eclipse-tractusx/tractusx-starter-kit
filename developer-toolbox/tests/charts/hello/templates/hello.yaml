apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}
  labels: { app: {{ .Release.Name }} }
spec:
  containers:
    - name: whoami
      image: traefik/whoami:v{{ .Chart.AppVersion }}
      args: ["--name", {{ .Values.message | quote }}]
      ports: [{ containerPort: 80 }]
      readinessProbe:
        httpGet: { path: /health, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: { app: {{ .Release.Name }} }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  rules:
    - host: hello.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ .Release.Name }}, port: { number: 80 } }
