# LimitRange and ResourceQuota (and the namespace boundary check) are namespace policies of the cluster the toolbox
# deploys into, not of this manifest; a quota here would also cap the whole Umbrella release.
# No AppArmor annotation: kind nodes often cannot enforce AppArmor, and the kubelet then refuses the pod.
# This test chart pulls traefik/whoami by tag, like the toolbox's own tck-echo pod.
